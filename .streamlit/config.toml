[server]
# Avoid scanning Transformers' lazy modules and importing unused model backends.
# Community Cloud still redeploys when the connected GitHub branch changes.
fileWatcherType = "none"

[theme]
base = "dark"
primaryColor = "#86a1bd"
backgroundColor = "#202328"
secondaryBackgroundColor = "#262d35"
textColor = "#dedfe3"
font = "sans serif"
