services:
  aws-mock:
    image: motoserver/moto:5.1.22
    environment:
      MOTO_PORT: "5000"
      MOTO_IAM_LOAD_MANAGED_POLICIES: "true"
      MOTO_S3_ROOT: /data/s3
    ports:
      - "4566:5000"
    volumes:
      - moto-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  aws-init:
    build: .
    command: python scripts/init_aws_mock.py
    environment:
      AWS_ENDPOINT_URL: http://aws-mock:5000
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      aws-mock:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: uvicorn api:app --app-dir src --host 0.0.0.0 --port 8000
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      RAG_BASE_DATA_DIR: /app/data
      RAG_STATE_DATA_DIR: /app/data
      OBJECT_STORAGE_BACKEND: s3
      S3_BUCKET: rag-documents
      AWS_ENDPOINT_URL: http://aws-mock:5000
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      aws-init:
        condition: service_completed_successfully
    networks:
      - default
      - evaluation

  ui:
    build: .
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      RAG_BASE_DATA_DIR: /app/data
      RAG_STATE_DATA_DIR: /app/data
      OBJECT_STORAGE_BACKEND: s3
      S3_BUCKET: rag-documents
      AWS_ENDPOINT_URL: http://aws-mock:5000
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  blackbox-eval:
    image: python:3.12-alpine
    profiles:
      - evaluation
    user: "65534:65534"
    command: python /evaluation/run_blackbox.py

    environment:
      EVALUATION_API_URL: http://api:8000
      EVALUATION_CASES: /evaluation/cases.json
      STRICT_MODE: "0"

    volumes:
      - ./evaluation:/evaluation:ro

    read_only: true

    tmpfs:
      - /tmp:size=16m,noexec,nosuid

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50

    networks:
      - evaluation

    depends_on:
      api:
        condition: service_healthy

volumes:
  moto-data:

networks:
  evaluation:
    internal: true
