apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag-platform
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/part-of: hybrid-search-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
        app.kubernetes.io/part-of: hybrid-search-rag
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: semantic-search-rag:local
          imagePullPolicy: Never
          command: ["uvicorn"]
          args: ["api:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef:
                name: rag-config
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /app/state
            - name: temp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: rag-state
        - name: temp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag-platform
spec:
  selector:
    app.kubernetes.io/name: rag-api
  ports:
    - name: http
      port: 8000
      targetPort: http
